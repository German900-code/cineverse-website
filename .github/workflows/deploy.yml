name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check TMDB token
        env:
          TMDB_TOKEN: ${{ secrets.VITE_TMDB_TOKEN }}
        run: |
          if [ -z "$TMDB_TOKEN" ]; then
            echo "::error::VITE_TMDB_TOKEN secret is missing!"
            exit 1
          fi

          echo "TMDB token is present."

          STATUS=$(curl -s -o /tmp/tmdb.json -w "%{http_code}" \
            -H "Authorization: Bearer $TMDB_TOKEN" \
            -H "accept: application/json" \
            "https://api.themoviedb.org/3/movie/popular")

          echo "TMDB response status: $STATUS"

          if [ "$STATUS" != "200" ]; then
            echo "TMDB response:"
            cat /tmp/tmdb.json
            exit 1
          fi

          echo "TMDB API works!"

      - name: Build
        run: npm run build
        env:
          VITE_TMDB_TOKEN: ${{ secrets.VITE_TMDB_TOKEN }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
